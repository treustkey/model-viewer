<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAR — model-viewer (Robot)</title>

    <script type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0f1115;
            color: #eee;
            font-family: system-ui, sans-serif;
        }
        header {
            text-align: center;
            padding: 16px;
        }
        model-viewer {
            width: 100%;
            height: 70vh;
            background: #1a1a1a;
            --poster-color: #1a1a1a;
        }
        .hint {
            text-align: center;
            padding: 12px;
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <header>
        <h1>WebAR-сценарий на &lt;model-viewer&gt;</h1>
    </header>

    <model-viewer
        src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb"
        ios-src="https://modelviewer.dev/shared-assets/models/RobotExpressive.usdz"
        alt="3D-модель робота"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls>
    </model-viewer>

    <p class="hint">
        Вращайте модель мышью/пальцем. На мобильном устройстве нажмите кнопку «AR» 
        (иконка куба с плюсиком внизу справа), чтобы разместить робота в реальной среде.
    </p>

</body>
</html>
